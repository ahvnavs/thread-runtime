[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thread-runtime"
version = "0.21.0"
description = "THREAD — Code-Driven Cinematic Game Runtime"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "THREAD Authors" }
]
dependencies = [
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "pygame-ce>=2.5.0"
]

[project.scripts]
thread = "thread_runtime.cli:main"
