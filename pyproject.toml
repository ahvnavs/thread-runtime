[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "thread-runtime"
version = "0.1.0"
description = "Lightweight, portable, terminal-first runtime for interactive story experiences."
requires-python = ">=3.14"
dependencies = []

[project.scripts]
thread = "thread_runtime.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
